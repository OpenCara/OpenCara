name: deploy

# Release-deploy the OpenCara server to opencara.com.
#
# On every `v<semver>` tag we build a versioned Docker image, push it to GHCR,
# and roll it out to the production host over Tailscale SSH — gating the run on the new
# container reporting healthy. Because each release is a distinct, immutable
# image tag in GHCR, rollback is "redeploy a prior tag" with no rebuild: use
# the `workflow_dispatch` entry point (or run deploy/deploy.sh on the host).
# See deploy/README.md for the required secrets, host prerequisites, and the
# rollback procedure.
#
# This runs ALONGSIDE publish-cli.yml (same `v*.*.*` trigger): that ships the
# npm CLI, this ships the server. They're independent.

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual rollback / redeploy of an already-built image — no build step.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to (re)deploy, e.g. v1.0.1'
        required: true
        type: string

# Never let two production rollouts interleave; queue them instead of
# cancelling (a half-applied deploy is worse than a slightly delayed one).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push image
    # Only build on a tag push. Manual dispatch deploys an existing image.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the image to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for the on-main ancestry check

      - name: Verify tag is on main
        # Tags can point anywhere; only ship a commit that's actually on main
        # so a feature-branch tag can never deploy to production.
        run: |
          # checkout used fetch-depth: 0, so full history is already present —
          # fetch main WITHOUT --depth so we don't re-shallow the repo and break
          # the ancestry check for a tag pointing at an older commit.
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag commit ${GITHUB_SHA} is not on main; refusing to deploy."
            exit 1
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=semver,pattern=v{{version}}
            # Move `latest` only for real releases, never for prereleases
            # (v1.2.3-rc.1 must not become what a fresh `:latest` pull gets).
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # gha cache makes repeat builds (and re-runs) reuse unchanged layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to opencara.com
    needs: [build-and-push]
    # Run after a successful build on tag push, OR standalone on manual
    # dispatch (where build-and-push is skipped). always() keeps the job from
    # being skipped along with its skipped dependency.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.build-and-push.result == 'success') }}
    runs-on: ubuntu-latest
    # Gate on the `production` environment so required reviewers / protection
    # rules (configured in repo settings) apply before anything touches the host.
    environment: production
    permissions:
      contents: read
      # Lets the job's GITHUB_TOKEN serve as the host's GHCR pull credential
      # (forwarded to deploy.sh below) when no GHCR_PULL_TOKEN secret is set.
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Image tag '$TAG' must be v<semver> (got '$TAG')."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        # The host is reached over the tailnet, not the public internet: it
        # exposes no sshd, only Tailscale SSH. The runner joins as an
        # ephemeral node tagged tag:ci; the tailnet policy must let tag:ci
        # SSH (action "accept", not "check") into the host as DEPLOY_SSH_USER.
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_SSH_HOST }}

      - name: Configure SSH target
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          # Tailscale SSH authenticates by tailnet identity — no key, and the
          # tailnet already pins the peer, so don't prompt on the host key of
          # an ephemeral runner with an empty known_hosts.
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host deploy-host
            HostName ${DEPLOY_SSH_HOST}
            User ${DEPLOY_SSH_USER}
            BatchMode yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF

      - name: Copy deploy assets to host
        # Repo is the source of truth for the compose file + deploy script; ship
        # the current versions every release so the host never drifts.
        run: |
          tar -C deploy -cf - docker-compose.prod.yml deploy.sh \
            | ssh deploy-host 'tar -xf - -C /opt/opencara'

      - name: Deploy over Tailscale SSH
        env:
          OPENCARA_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          # GHCR pull credential for the host. Preference order:
          #   1. GHCR_PULL_TOKEN secret (long-lived PAT), if configured;
          #   2. the job's ephemeral GITHUB_TOKEN (packages: read above) —
          #      forwarded over SSH for `docker login`, valid only for the
          #      job's lifetime, scoped to this repo's packages. This makes
          #      private GHCR packages work with zero standing secrets; the
          #      stale login it leaves in ~/.docker/config.json expires with
          #      the job. Public packages never hit either path in practice
          #      (anonymous pull succeeds), but login is harmless there.
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
        run: |
          # The token goes over stdin, never onto the remote command line
          # (where it would show up in the host's process list).
          printf '%s\n' "$GHCR_TOKEN" | ssh deploy-host \
            "OPENCARA_IMAGE_TAG=$(printf %q "$OPENCARA_IMAGE_TAG") GHCR_USERNAME=$(printf %q "$GHCR_USERNAME") bash -c '
              set -euo pipefail
              IFS= read -r GHCR_TOKEN; export GHCR_TOKEN OPENCARA_IMAGE_TAG GHCR_USERNAME
              chmod +x /opt/opencara/deploy.sh
              exec /opt/opencara/deploy.sh </dev/null
            '"
